name: build
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - name: dist/app.js is up to date
        run: git diff --exit-code dist/app.js || (echo "Run npm run build and commit dist/app.js" && exit 1)
